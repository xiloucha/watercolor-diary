<div class="app">


  <!-- =========================
       START
  ========================= -->

  <section
    *ngIf="screen === 'start'"
    class="start-screen"
  >

    <div class="start-content">

      <p class="small-title">
        TODAY'S
      </p>

      <h1>
        色あつめ帖
      </h1>

      <p class="description">
        今日の気分を、絵の具にして。
      </p>

      <button
        class="start-button"
        (click)="startDiary()"
      >
        START
      </button>

    </div>

  </section>



  <!-- =========================
       DIARY
  ========================= -->

  <section
    *ngIf="screen === 'diary'"
    class="diary-screen"
  >

    <header class="header">

      <div class="header-top">

        <div></div>

        <div>

          <p class="small-title">
            TODAY'S
          </p>

          <h1>
            色あつめ帖
          </h1>

          <div class="date">
            {{ selectedDate }}
          </div>

        </div>

        <button
          class="calendar-icon"
          (click)="openCalendar()"
        >
          CAL
        </button>

      </div>

    </header>



    <main class="diary-main">


      <!-- =========================
           PAPER
      ========================= -->

      <div class="paper">


        <!--
          制作中も保存後も、
          Canvasで作った同じ画像を表示。

          CSS maskは使用しない。
        -->

        <img
          *ngIf="previewImage"
          class="watercolor-image"
          [src]="previewImage"
          alt=""
          (click)="onClickPreview($event)"
        >


        <!-- EMPTY -->

        <div
          *ngIf="!previewImage"
          class="paper-message"
        >
          ここに今日の色を。
        </div>


        <!-- TEXTURE -->

        <div
          class="paper-texture"
        ></div>


      </div>



      <!-- =========================
           COLOR HISTORY
      ========================= -->

      <div
        class="paint-history"
        *ngIf="paints.length > 0"
      >

        <span
          *ngFor="
            let paint of paints;
            trackBy: trackPaint
          "
          class="history-dot"
          [style.background]="paint.color"
        ></span>

      </div>



      <!-- =========================
           PALETTE
      ========================= -->

      <div class="palette">

        <button
          *ngFor="let color of colors"
          class="color-button"
          [style.background]="color"
          (click)="dropPaint(color)"
          type="button"
        ></button>

      </div>


      <p class="palette-help">
        色を重ねて、今日の気分をつくろう
      </p>



      <!-- =========================
           MEMO
      ========================= -->

      <div class="memo-area">

        <label>
          MEMO
        </label>

        <textarea
          [(ngModel)]="memo"
          placeholder="今日のことを少しだけ……"
        ></textarea>

      </div>



      <!-- =========================
           ACTIONS
      ========================= -->

      <div class="actions">

        <button
          class="secondary-button"
          (click)="saveCurrentEntry()"
          type="button"
        >
          SAVE
        </button><button
        class="secondary-button"
        (click)="downloadCurrentEntry()"
        type="button"
      >
        DOWNLOAD
      </button>

        <button
          class="secondary-button"
          (click)="resetDiary()"
          type="button"
        >
          CLEAR
        </button>

      </div>


    </main>

  </section>



  <!-- =========================
       CALENDAR
  ========================= -->

  <section
    *ngIf="screen === 'calendar'"
    class="calendar-screen"
  >

    <header class="calendar-header">

      <button
        class="month-button"
        (click)="previousMonth()"
        type="button"
      >
        ‹
      </button>

      <div>

        <p class="small-title">
          MY COLORS
        </p>

        <h1>
          {{ calendarTitle }}
        </h1>

      </div>

      <button
        class="month-button"
        (click)="nextMonth()"
        type="button"
      >
        ›
      </button>

    </header>



    <div class="calendar">


      <!-- WEEK DAYS -->

      <div
        *ngFor="let day of weekDays"
        class="weekday"
      >
        {{ day }}
      </div>



      <!-- DAYS -->

      <ng-container
        *ngFor="let date of calendarDays"
      >


        <!-- EMPTY -->

        <div
          *ngIf="date === null"
          class="calendar-empty"
        ></div>



        <!-- DAY -->

        <button
          *ngIf="date !== null"
          class="calendar-day"
          [class.has-entry]="hasEntry(date)"
          (click)="openEntry(dateKey(date))"
          type="button"
        >

          <span class="day-number">
            {{ date.getDate() }}
          </span>



          <!--
            保存済みの完成画像そのものを
            imgとして縮小表示する。

            グラデーション再生成はしない。
          -->

          <img
            *ngIf="getEntry(date)?.image"
            class="thumbnail-image"
            [src]="getEntry(date)?.image"
            alt=""
          >

        </button>

      </ng-container>

    </div>



    <!-- BACK -->

    <button
      class="back-button"
      (click)="backToDiary()"
      type="button"
    >
      TODAY
    </button>

  </section>

</div>
@if(ismarkon){
<div #mark
class="mark">
</div>
}
